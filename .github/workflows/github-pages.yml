name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean output directory
        run: rm -rf out

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.sricode.com

      - name: Clean problematic files
        run: |
          echo "Cleaning problematic files..."
          # Remove source maps and dev files
          find out/ -name "*.map" -delete
          find out/ -name "*.js.map" -delete
          find out/ -name "*.css.map" -delete
          # Remove large dev files
          find out/ -name "*devtools*" -delete
          find out/ -name "*node_modules*" -delete
          # Remove any files larger than 2MB (except images)
          find out/ -type f -size +2M ! -name "*.png" ! -name "*.jpg" ! -name "*.jpeg" ! -name "*.gif" ! -name "*.webp" -delete
          echo "Cleanup completed"

      - name: Verify output directory
        run: |
          echo "Output directory contents:"
          ls -la out/
          echo "Checking for problematic files:"
          find out/ -type l -ls || echo "No symlinks found"
          find out/ -name ".*" -type f | head -10 || echo "No hidden files found"
          echo "File sizes:"
          du -h out/ | sort -hr | head -10

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: out

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
